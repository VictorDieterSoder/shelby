<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cantina</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/conexao.css">
    <link rel="stylesheet" href="css/refinamento-visual.css">
    <script defer src="js/telas.js"></script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Cantina</h1>
                <p>Sistema de Gestão</p>
            </div>

            <form>

                <div class="campo">
                    <label for="email">Login ou e-mail</label>
                    <input 
                        type="text" 
                        id="email" 
                        placeholder="Digite seu login ou e-mail"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Digite sua senha"
                    >
                </div>

                <div class="opcoes">

                    <label class="lembrar">
                        <input type="checkbox">
                        <span>Lembrar de mim</span>
                    </label>

                    <a href="#">Esqueci minha senha</a>

                </div>

                <button type="submit" class="botao-login">
                    Entrar
                </button>

            </form>

            <div class="cadastro">
                <p>
                    Precisa cadastrar outro operador? Entre com uma conta gestora e use “Cadastrar operador” no menu.
                </p>
            </div>

        </div>

    </main>

</body>
</html>
