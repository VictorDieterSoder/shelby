<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Cantina</title>

    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="stylesheet" href="../css/conexao.css">
    <link rel="stylesheet" href="../css/refinamento-visual.css">
    <script defer src="../js/telas.js"></script>
</head>

<body>

    <main class="cadastro-container">

        <div class="cadastro-card">

            <div class="logo">
                <div class="logo-icon"></div>

                <h1>Criar conta</h1>

                <p>Cadastre-se para acessar a Cantina</p>
            </div>


            <form>

                <div class="campo">

                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                    >

                </div>


                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <div class="campo">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >

                </div>


                <div class="campo">

                    <label for="confirmar-senha">Confirmar senha</label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        placeholder="Digite a senha novamente"
                    >

                </div>


                <button type="submit" class="botao-cadastro">
                    Criar conta
                </button>

            </form>


            <div class="voltar">

                <p>
                    Já possui uma conta?
                    <a href="../index.html">Voltar para o login</a>
                </p>

            </div>

        </div>

    </main>

</body>

</html>
